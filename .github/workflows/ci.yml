name: ci

on:
  push:
    branches: [preview]
  pull_request:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        env:
          VITE_PEARL_NETWORK: mainnet
        run: npx vitest run

      - name: Build Preview wallet
        env:
          VITE_PEARL_NETWORK: testnet2
        run: npm run build
