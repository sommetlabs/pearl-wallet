name: ci

on:
  push:
    branches: [preview]
  pull_request:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace packages/connector
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: abyss-wallet-extension
          path: dist-extension/
          if-no-files-found: error
